    <app-admin-header />
    @let members = members$ | async;

    <main class="admin-page">
      <h1>Padrinhos</h1>
      @if (shouldShowForm(members)) {
        <form class="form-card" (ngSubmit)="saveMember()">
          <label>
            Primeira pessoa
            <input name="firstName" [(ngModel)]="firstName" required />
          </label>
          <label>
            Segunda pessoa
            <input name="secondName" [(ngModel)]="secondName" required />
          </label>
          <label>
            Lado
            <select name="side" [(ngModel)]="side">
              <option value="couple">Casal</option>
              <option value="bride">Noiva</option>
              <option value="groom">Noivo</option>
            </select>
          </label>
          <app-image-upload-field
            [imageUrl]="imageUrl(photoUrl)"
            alt="Previa da foto dos padrinhos"
            emptyTitle="Adicionar foto dos padrinhos"
            emptyDescription="Toque para enviar uma foto. URLs manuais nao sao mais usadas."
            [disabled]="isDemoMode()"
            [uploading]="isUploadingPhoto"
            (fileSelected)="uploadPhoto($event)"
          />
          <button class="primary-action" type="submit" [disabled]="isDemoMode()">{{ editingMemberId ? 'Salvar padrinhos' : 'Adicionar padrinhos' }}</button>
          @if (members?.length) {
            <button class="secondary-action" type="button" (click)="closeForm()">Cancelar</button>
          }
        </form>
      } @else if (members?.length) {
        <app-floating-add-button label="Adicionar padrinhos" [disabled]="isDemoMode()" (pressed)="openForm()" />
      }

      <div class="list-stack">
        @for (member of members; track member.id) {
          <app-photo-action-card
            [title]="shortCoupleName(member)"
            [subtitle]="sideLabel(member.side)"
            [imageUrl]="imageUrl(member.photoUrl)"
            [initials]="shortCoupleName(member).slice(0, 1)"
            [expanded]="isExpanded(member.id)"
            (expandedChange)="setExpandedMember(member.id, $event)"
          >
            @if (member.invitationStatus === 'accepted') {
              <app-status-check status label="Aceitou" />
            }
            <ng-container actions>
              <a class="icon-action" [href]="groomsmenPrintUrl(member)" target="_blank" rel="noreferrer" aria-label="Imprimir convite dos padrinhos">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M7 8V4h10v4" />
                  <path d="M6 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-1" />
                  <path d="M7 14h10v6H7z" />
                </svg>
              </a>
              <a class="icon-action" [class.demo-disabled]="isDemoMode()" [attr.aria-disabled]="isDemoMode()" [href]="groomsmenWhatsappInviteLink(member)" target="_blank" rel="noreferrer" aria-label="Enviar convite dos padrinhos">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 6h16v12H4z" />
                  <path d="m4 7 8 6 8-6" />
                </svg>
              </a>
              <button class="icon-action" type="button" [disabled]="isDemoMode()" (click)="editMember(member)" aria-label="Editar padrinhos">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m4 20 4.5-1 10-10a2.1 2.1 0 0 0-3-3l-10 10L4 20Z" />
                  <path d="m14 6 4 4" />
                </svg>
              </button>
              <button class="icon-action" type="button" [disabled]="isDemoMode()" (click)="removeMember(member.id)" aria-label="Remover padrinhos">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5 7h14" />
                  <path d="M9 7V5h6v2" />
                  <path d="M8 10v8" />
                  <path d="M16 10v8" />
                  <path d="M6.5 7 7 21h10l.5-14" />
                </svg>
              </button>
            </ng-container>
          </app-photo-action-card>
        } @empty {
          <p>Nenhum padrinho cadastrado ainda.</p>
        }
      </div>
    </main>
